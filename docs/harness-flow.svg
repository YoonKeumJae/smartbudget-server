<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Codex 완료 전 검증 하네스 흐름</title>
  <desc id="diagram-description">UserPromptSubmit 훅이 세션별 마지막 검증 통과 지문을 준비하고 docs/index.md 확인 안내를 추가합니다. Codex 작업 뒤 Stop 훅이 파일 변경을 확인합니다. 변경이 있으면 Ruff 자동 수정 직후 지문을 고정하고, 전체 285초 내부 마감 안에서 Ruff와 docstring 및 pytest 검사 후 Luna 검토를 실행합니다. 마지막 지문이 고정한 지문과 같을 때만 통과 지문을 갱신합니다. 실패 시 첫 Stop은 Codex 재개를 요청하고 재개 후에는 경고를 반환하지만 종료를 강제로 거부하지는 않습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#617496"/>
    </marker>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #17254b; }
      .title { font-size: 48px; font-weight: 800; }
      .subtitle { font-size: 22px; fill: #526587; }
      .heading { font-size: 28px; font-weight: 750; }
      .body { font-size: 22px; fill: #415373; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 21px; fill: #344d78; }
      .branch { font-size: 20px; font-weight: 700; fill: #526587; }
      .outcome { font-size: 25px; font-weight: 750; }
      .small { font-size: 19px; fill: #61708d; }
      .line { fill: none; stroke: #617496; stroke-width: 3; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #c9d5e8; stroke-width: 2.5; }
      .hook { fill: #eaf0ff; stroke: #9fb6e9; }
      .check { fill: #f2f7ff; stroke: #94b2e5; }
      .review { fill: #eef9f5; stroke: #8ac9b7; }
      .success { fill: #e9f8ed; stroke: #80bd8b; }
      .failure { fill: #fff1ed; stroke: #e8ad9d; }
    </style>
  </defs>

  <rect width="1600" height="1600" fill="#f8faff"/>
  <text x="160" y="78" class="title">Codex 완료 전 검증 하네스</text>
  <text x="162" y="114" class="subtitle">Stop 300초 · 내부 마감 285초 · 실패 시 지문을 유지해 재검사합니다.</text>

  <path class="line" d="M 650 278 V 315"/>
  <path class="line" d="M 650 460 V 495"/>
  <path class="line" d="M 650 588 V 623"/>
  <path class="line" d="M 650 736 V 771"/>
  <path class="line" d="M 650 906 V 941"/>
  <path class="line" d="M 650 1186 V 1221"/>
  <path class="line" d="M 650 1371 V 1406"/>
  <path class="line" d="M 1140 841 H 1185"/>
  <path class="line" d="M 1140 1065 H 1185"/>
  <path class="line" d="M 1140 1298 H 1185"/>
  <path class="line" d="M 1140 1460 H 1185"/>

  <rect x="160" y="160" width="980" height="118" rx="20" class="card hook"/>
  <text x="196" y="207" class="heading">1 · 사용자 요청 접수와 문서 안내</text>
  <text x="196" y="247" class="code">.codex/hooks.json: UserPromptSubmit → main("start")</text>
  <text x="196" y="271" class="small">docs/index.md → 작업 범위 문서 확인 안내</text>

  <rect x="160" y="320" width="980" height="140" rx="20" class="card"/>
  <text x="196" y="365" class="heading">2 · 세션별 마지막 통과 지문 보존</text>
  <text x="196" y="405" class="code">scripts/harness.py: state_path() · project_snapshot()</text>
  <text x="196" y="438" class="body">.harness-state/ · 재개된 요청은 기존 지문을 덮어쓰지 않음</text>

  <rect x="160" y="500" width="980" height="88" rx="20" class="card"/>
  <text x="196" y="554" class="heading">Codex가 요청된 작업 수행</text>

  <rect x="160" y="628" width="980" height="108" rx="20" class="card hook"/>
  <text x="196" y="674" class="heading">3 · 완료 직전 훅 실행</text>
  <text x="196" y="713" class="code">.codex/hooks.json: Stop → main("stop")</text>

  <rect x="160" y="776" width="980" height="130" rx="20" class="card"/>
  <text x="196" y="821" class="heading">4 · 파일 변경 여부 비교</text>
  <text x="196" y="862" class="code">scripts/harness.py: project_snapshot() → changed_paths()</text>
  <text x="196" y="889" class="small">Git 관리 대상과 신규 프로젝트 파일의 내용을 비교</text>

  <rect x="1190" y="788" width="340" height="108" rx="20" class="card success"/>
  <text x="1221" y="831" class="outcome">변경 없음</text>
  <text x="1221" y="869" class="body">검사 없이 종료</text>

  <rect x="160" y="946" width="980" height="240" rx="20" class="card check"/>
  <text x="196" y="991" class="heading">5 · 자동 수정과 검사</text>
  <text x="196" y="1030" class="code">scripts/harness.py: apply_safe_fixes() → check_project()</text>
  <text x="210" y="1065" class="body">run_command() → Ruff 안전 수정·포맷팅 (각 15초)</text>
  <text x="210" y="1098" class="body">project_snapshot() → 검사 기준 지문 고정</text>
  <text x="210" y="1131" class="body">Ruff D300 · missing_docstrings() → Python 검사</text>
  <text x="210" y="1164" class="body">run_command() → pytest -q (100초)</text>

  <rect x="1190" y="1010" width="340" height="130" rx="20" class="card failure"/>
  <text x="1221" y="1056" class="outcome">검사 실패</text>
  <text x="1221" y="1091" class="code">hook_response()</text>
  <text x="1221" y="1120" class="small">첫 실패: 재개 · 이후: 경고</text>

  <rect x="160" y="1226" width="980" height="145" rx="20" class="card review"/>
  <text x="196" y="1272" class="heading">6 · 별도 AI 검토</text>
  <text x="196" y="1311" class="code">scripts/harness.py: review_project() → run_command()</text>
  <text x="196" y="1347" class="body">읽기 전용 Luna (110초): 문서 모순 · 코드 반영 · docstring 맥락</text>

  <rect x="1190" y="1233" width="340" height="130" rx="20" class="card failure"/>
  <text x="1221" y="1279" class="outcome">검토 실패</text>
  <text x="1221" y="1314" class="code">hook_response()</text>
  <text x="1221" y="1343" class="small">첫 실패: 재개 · 이후: 경고</text>

  <rect x="160" y="1411" width="980" height="100" rx="20" class="card success"/>
  <text x="196" y="1456" class="heading">7 · 지문 재비교 → 같으면 통과 지문 갱신</text>
  <text x="196" y="1490" class="code">scripts/harness.py: project_snapshot() · hook_response()</text>

  <rect x="1190" y="1416" width="340" height="95" rx="20" class="card failure"/>
  <text x="1221" y="1455" class="outcome">검증 중 파일 변경</text>
  <text x="1221" y="1489" class="small">지문 유지 · 실패 보고 요청</text>

  <text x="160" y="1564" class="small">현재 범위: 로컬 Codex 훅 · Ruff · docstring 검사 · pytest · Luna 검토</text>
  <text x="1530" y="1564" text-anchor="end" class="small">Stop 훅은 종료 거부를 보장하지 않음</text>
</svg>
